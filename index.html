o<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><title>Permisos Dinámicos</title><style>
    body { font-family: Arial, sans-serif; background: #0A1E3A; color: #E0E0E0; margin:0; padding:20px;}
    .formulario { background: #122A4A; padding:20px; border-radius:6px; max-width:800px; margin:auto;}
    select, input[type=text], input[type=checkbox] { background:#20456D; color:#E0E0E0; border:1px solid #3A5A8C; border-radius:4px; }
    table { width:100%; border-collapse:collapse; margin-top:10px;}
    th { background-color:#163754; padding:10px; }
    td { padding:10px; text-align:center; border-bottom:1px solid #3A5A8C;}
    .option-cell { text-align:left; }
  </style></head><body>
    <div class="formulario">
      <h2>Permisos según Módulo o Usuarios</h2>
      <div>
        <label for="modulo">Seleccion de Módulo:</label>
        <select id="modulo"><option value="">-- Módulo --</option>
          <option value="registro">Registro Académico</option>    
          <option value="docentes">Docentes</option> 
          <option value="coordinadores">Coordinadores Academicos</option>
          <option value="administradores">Administradores</option>
        </select>
      </div>
      <div>
        <label for="modulo">Seleccion de Usuario:</label>
        <select id="modulo"><option value="">-- Usuarios --</option>
          <option value="academico">Max Somarriba</option>
          <option value="registro">Walter Gomez</option>
          <option value="coordinadores">Silvia Reyes</option>
          <option value="administradores">Ana Reyes</option>
          <option value="administradores">Carlos Miranda</option>          
          <option value="administradores">Jorge Moreno</option>
          <option value="administradores">Xochilt Hernandez</option>
        </select>
      </div>
      <div id="contenido">
        <!-- Aquí se cargan las tablas según selección -->
      </div>
    </div>
  
  <script>
    const contenido = document.getElementById('contenido');
    const data = {
      registro : [
        'Crear estudiantes','Matrícula Estudiantil','Examenes de Ubicación','Cambio de programas','Cambio de Horario','Cambio de Sedes'
      ],
      registro: [
        'Registro de Usuarios','Control de Asistencias',
        'Crear Estudiantes','Grupos de Docentes','Asignar a Grupos de Clase'
      ],
      coordinadores: [
        'Lista de Estudiantes','Crear Docentes','Sesiones','Grupos',
        'Salones','Niveles','Programas','Modalidades','Cronograma / Horarios','Cierre de Notas'
      ],
      administradores: [
        'Configuración del Sistema','Auditoría'
      ]
    };
  
    document.getElementById('modulo').addEventListener('change', function(){
      const key = this.value;
      if (!data[key]) {
        contenido.innerHTML = '';
        return;
      }
      let html = `<table><thead><tr>
        <th>Permiso</th><th>Opción</th><th>Consultar</th><th>Insertar</th><th>Actualizar</th><th>Eliminar</th>
      </tr></thead><tbody>`;
      data[key].forEach(opt => {
        html += `<tr><td><input type="checkbox"></td>
          <td class="option-cell">${opt}</td>
          <td><input type="checkbox" checked></td>
          <td><input type="checkbox"></td>
          <td><input type="checkbox"></td>
          <td><input type="checkbox"></td>
        </tr>`;
      });
      html += '</tbody></table>';
      contenido.innerHTML = html;
    });
  </script>

  </body></html>
