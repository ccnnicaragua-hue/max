<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Módulo de Registro Académico</title>
<style>
    body {
        font-family: Arial, sans-serif;
        background: #f5f5f5;
        margin: 0;
        padding: 0;
    }
    header {
        background: #004080;
        color: white;
        padding: 15px;
        text-align: center;
        font-size: 1.5em;
    }
    nav {
        background: #003366;
    }
    nav ul {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
    }
    nav ul li {
        position: relative;
    }
    nav a {
        display: block;
        padding: 14px 20px;
        color: white;
        text-decoration: none;
        transition: background 0.3s;
    }
    nav a:hover {
        background: #0055aa;
    }
    /* Submenús */
    nav ul ul {
        display: none;
        position: absolute;
        top: 100%;
        left: 0;
        background: #003366;
        min-width: 180px;
        flex-direction: column;
    }
    nav ul ul li {
        width: 100%;
    }
    nav ul li:hover > ul {
        display: flex;
    }
    /* Estilos para el contenido */
    section {
        padding: 20px;
    }
    .card {
        background: white;
        padding: 15px;
        margin: 10px 0;
        border-radius: 8px;
        box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
</style>
</head>
<body>

<header>
    📚 Módulo de Registro Académico
</header>

<nav>
    <ul>
        <li><a href="#">Estudiantes</a>
            <ul>
                <li><a href="#" onclick="mostrarContenido('Registrar Estudiante')">Registrar Estudiante</a></li>
                <li><a href="#" onclick="mostrarContenido('Consultar Estudiante')">Consultar Estudiante</a></li>
            </ul>
        </li>
        <li><a href="#">Cursos</a>
            <ul>
                <li><a href="#" onclick="mostrarContenido('Registrar Curso')">Registrar Curso</a></li>
                <li><a href="#" onclick="mostrarContenido('Consultar Curso')">Consultar Curso</a></li>
            </ul>
        </li>
        <li><a href="#">Notas</a>
            <ul>
                <li><a href="#" onclick="mostrarContenido('Ingresar Notas')">Ingresar Notas</a></li>
                <li><a href="#" onclick="mostrarContenido('Consultar Notas')">Consultar Notas</a></li>
            </ul>
        </li>
    </ul>
</nav>

<section id="contenido">
    <div class="card">
        Bienvenido al sistema de registro académico.  
        Selecciona una opción del menú para comenzar.
    </div>
</section>

<script>
    function mostrarContenido(titulo) {
        document.getElementById('contenido').innerHTML = `
            <div class="card">
                <h2>${titulo}</h2>
                <p>Aquí iría el formulario o consulta para <strong>${titulo}</strong>.</p>
            </div>
        `;
    }
</script>

</body>
</html>
